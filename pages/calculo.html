<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Sub-Redes IPv4</title>

    <link rel="stylesheet" href="../css/main_page.css">
    <link rel="stylesheet" href="../css/menu.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&Orbitron:wght@700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="ip-flow-background" id="ipFlowBg"></div>

    <div class="fade-in-bottom">
        <h1 class="title-glow-subtle">IPv4</h1>

        <div class="input-container">
            <label class="label-container">IP: </label>
            <input class="input-dados" type="text" id="ip" placeholder="192.168.1.0">
            <br><br>

            <label class="label-container">CIDR ou Máscara: </label>
            <input class="input-dados" type="text" id="cidr" placeholder="Ex: /24 ou 255.255.255.0">
            <br><br>
        </div>

        <button class="calc-button" onclick="calcularSubredes()">Calcular</button>
        <br><br>
    </div>

    <div class="mensagem-erro fade-in-bottom" id="mensagem-erro"></div>

    <div id="cards-resumo"></div>

    <div id="resultado"></div>

    <script src="../js/calculo.js"></script>
</body>

</html>
