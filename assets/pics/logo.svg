<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="256" height="256" fill="#0f172a" rx="32"/>
  
  <!-- Main hexagon container -->
  <defs>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0.05" />
    </linearGradient>
  </defs>
  
  <!-- Hexagon path -->
  <path d="M 128 40 L 190 80 L 190 160 L 128 200 L 66 160 L 66 80 Z" 
        fill="url(#hexGrad)" 
        stroke="#10b981" 
        stroke-width="4"
        stroke-linejoin="round"/>
  
  <!-- Inner hexagon (smaller) -->
  <path d="M 128 60 L 175 87 L 175 153 L 128 180 L 81 153 L 81 87 Z" 
        fill="none" 
        stroke="#10b981" 
        stroke-width="2"
        opacity="0.4"
        stroke-linejoin="round"/>
  
  <!-- Network nodes at hexagon vertices -->
  <circle cx="128" cy="40" r="6" fill="#10b981" opacity="0.8"/>
  <circle cx="190" cy="80" r="6" fill="#10b981" opacity="0.8"/>
  <circle cx="190" cy="160" r="6" fill="#10b981" opacity="0.8"/>
  <circle cx="128" cy="200" r="6" fill="#10b981" opacity="0.8"/>
  <circle cx="66" cy="160" r="6" fill="#10b981" opacity="0.8"/>
  <circle cx="66" cy="80" r="6" fill="#10b981" opacity="0.8"/>
  
  <!-- Central network node -->
  <circle cx="128" cy="120" r="8" fill="#10b981" opacity="0.6"/>
  
  <!-- Connection lines from center to vertices -->
  <line x1="128" y1="120" x2="128" y2="40" stroke="#10b981" stroke-width="1.5" opacity="0.3"/>
  <line x1="128" y1="120" x2="190" y2="80" stroke="#10b981" stroke-width="1.5" opacity="0.3"/>
  <line x1="128" y1="120" x2="190" y2="160" stroke="#10b981" stroke-width="1.5" opacity="0.3"/>
  <line x1="128" y1="120" x2="128" y2="200" stroke="#10b981" stroke-width="1.5" opacity="0.3"/>
  <line x1="128" y1="120" x2="66" y2="160" stroke="#10b981" stroke-width="1.5" opacity="0.3"/>
  <line x1="128" y1="120" x2="66" y2="80" stroke="#10b981" stroke-width="1.5" opacity="0.3"/>
  
  <!-- CS Text -->
  <text x="128" y="138" 
        font-family="'Inter', 'Segoe UI', Arial, sans-serif" 
        font-size="68" 
        font-weight="700" 
        fill="#10b981" 
        text-anchor="middle"
        letter-spacing="-2">CS</text>
  
  <!-- Subtle glow effect on text -->
  <text x="128" y="138" 
        font-family="'Inter', 'Segoe UI', Arial, sans-serif" 
        font-size="68" 
        font-weight="700" 
        fill="#10b981" 
        text-anchor="middle"
        letter-spacing="-2"
        opacity="0.3"
        filter="blur(4px)">CS</text>
</svg>
